[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwave"
version = "0.1.0"
description = "Control your system volume and media with hand gestures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HandWave contributors" }]
keywords = ["gesture", "mediapipe", "opencv", "volume", "media", "webcam"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    # 0.10.22+ removed the legacy Solutions API used by the detector.
    "mediapipe>=0.10.14,<0.10.22",
    # mediapipe pulls in opencv-contrib-python (provides cv2); use it directly
    # instead of opencv-python to avoid a conflicting double cv2 install.
    "opencv-contrib-python>=4.8.0,<4.12",
    "numpy>=1.24.0,<2",
    "keyboard>=0.13.5",
    "pynput>=1.7.6",
    "rich>=13.0.0",
    "pycaw>=20240104; sys_platform == 'win32'",
    "comtypes>=1.2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/yourusername/handwave"
Repository = "https://github.com/yourusername/handwave"

[project.scripts]
handwave = "handwave.main:main"

[tool.setuptools.packages.find]
include = ["handwave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
